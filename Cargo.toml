[workspace]
members = [
    "apps/robotctl",
    "crates/integration/config-model",
    "crates/integration/cross-language-contract",
    "crates/integration/ros2-mapping",
    "crates/integration/test-support",
    "crates/integration/middleware-qualification",
    "crates/hardware_module/hardware-module-core",
    "crates/hardware_module/motor-damiao",
    "crates/hardware_module/transport-socketcan",
    "crates/protocol_module/contract-codec",
    "crates/protocol_module/message-model",
    "crates/protocol_module/middleware-api",
    "crates/protocol_module/middleware-local",
    "crates/protocol_module/middleware-shm",
    "crates/protocol_module/middleware-zenoh",
    "crates/protocol_module/proto-generated",
    "crates/application_module/chassis-mecanum",
    "crates/application_module/chassis-model",
    "crates/application_module/chassis-omni",
    "crates/application_module/chassis-swerve",
    "crates/application_module/control-core",
    "crates/application_module/state-estimation-2d",
    "crates/application_module/trajectory-se2",
    "tools/architecture-check",
    "tools/hsm-spike",
    "tools/proto-compat-check",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"

[workspace.dependencies]
allocation-counter = "=0.8.1"
arrayvec = "0.7.8"
bytemuck = { version = "=1.25.2", features = ["derive"] }
cargo_metadata = "0.23.1"
chassis-model = { version = "0.1.0", path = "crates/application_module/chassis-model" }
clap = { version = "4.6.4", features = ["derive"] }
config-model = { version = "0.1.0", path = "crates/integration/config-model" }
contract-codec = { version = "0.1.0", path = "crates/protocol_module/contract-codec" }
cross-language-contract = { version = "0.1.0", path = "crates/integration/cross-language-contract" }
hardware-module-core = { version = "0.1.0", path = "crates/hardware_module/hardware-module-core" }
message-model = { version = "0.1.0", path = "crates/protocol_module/message-model" }
middleware-api = { version = "0.1.0", path = "crates/protocol_module/middleware-api" }
middleware-local = { version = "0.1.0", path = "crates/protocol_module/middleware-local" }
middleware-shm = { version = "0.1.0", path = "crates/protocol_module/middleware-shm" }
middleware-zenoh = { version = "0.1.0", path = "crates/protocol_module/middleware-zenoh" }
motor-damiao = { version = "0.1.0", path = "crates/hardware_module/motor-damiao" }
prost = "0.14.4"
prost-build = "0.14.4"
prost-types = "0.14.4"
memmap2 = "=0.9.11"
proto-generated = { version = "0.1.0", path = "crates/protocol_module/proto-generated" }
ros2-mapping = { version = "0.1.0", path = "crates/integration/ros2-mapping" }
protoc-bin-vendored = "3.2.0"
rtrb = "=0.3.4"
rustix = { version = "=1.1.4", default-features = false, features = ["time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
socketcan = { version = "=3.6.2", default-features = false }
statig = { version = "=0.4.1", default-features = false }
tempfile = "=3.27.0"
thiserror = "2.0.19"
toml = "1.1.4"
waitfree-sync = "=0.3.3"
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"

[workspace.metadata.robot-architecture]
policy = "architecture.toml"

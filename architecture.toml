version = 1
composition_roots = ["robotctl"]

[classes.hardware_module]
allowed_dependencies = ["hardware_module"]
path_prefixes = ["crates/hardware_module/"]

[classes.protocol_module]
allowed_dependencies = ["protocol_module", "hardware_module"]
path_prefixes = ["crates/protocol_module/"]

[classes.application_module]
allowed_dependencies = ["application_module", "protocol_module"]
path_prefixes = ["crates/application_module/"]

[classes.integration]
allowed_dependencies = ["integration", "protocol_module"]
path_prefixes = ["crates/integration/"]

[classes.test-support]
allowed_dependencies = ["test-support", "integration", "application_module", "protocol_module", "hardware_module"]
path_prefixes = ["crates/integration/test-support/"]

[classes.app]
allowed_dependencies = ["app", "integration", "application_module", "protocol_module", "hardware_module"]
path_prefixes = ["apps/"]
composition_root = true

[classes.tool]
allowed_dependencies = ["tool"]
path_prefixes = ["tools/"]

[members]
"architecture-check" = "tool"
"config-model" = "integration"
"contract-codec" = "protocol_module"
"control-core" = "application_module"
"hardware-module-core" = "hardware_module"
"transport-socketcan" = "hardware_module"
"message-model" = "protocol_module"
"middleware-api" = "protocol_module"
"middleware-local" = "protocol_module"
"middleware-zenoh" = "protocol_module"
"motor-damiao" = "hardware_module"
"proto-generated" = "protocol_module"
"proto-compat-check" = "tool"
"robotctl" = "app"
"ros2-mapping" = "integration"
"test-support" = "test-support"

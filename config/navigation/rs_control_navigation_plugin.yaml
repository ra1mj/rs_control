      layout_id: rs-nav-odom-v001
      mode: latest
      capacity: 3
      freshness_ms: 100
    dynamic_tf:
      layout_id: rs-nav-tf---v001
      mode: latest
      capacity: 3
      freshness_ms: 100
    health:
      layout_id: rs-nav-health001
      mode: latest
      capacity: 3
      freshness_ms: 500

safety:
  final_constraint_owner: rs_control
  adapter_can_issue_leases: false

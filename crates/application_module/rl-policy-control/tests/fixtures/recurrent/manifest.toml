[[inputs]]
name = "observation"
dtype = "f32"
shape = [1, 2]

[[inputs]]
name = "state_in"
dtype = "f32"
shape = [1, 2]

[[outputs]]
name = "action"
dtype = "f32"
shape = [1, 2]

[[outputs]]
name = "state_out"
dtype = "f32"
shape = [1, 2]

[[observations]]
joint = "joint_1"
field = "position"
unit = "rad"
mean = 0.0
inverse_std = 1.0
minimum = -2.0
maximum = 2.0

[[observations]]
joint = "joint_2"
field = "position"
unit = "rad"
mean = 0.0
inverse_std = 1.0
minimum = -2.0
maximum = 2.0

[[recurrent]]
input = "state_in"
output = "state_out"
reset = [0.0, 0.0]

[action]
kind = "absolute_position"
output = "action"
scale = [1.0, 1.0]
offset = [0.0, 0.0]
hard_minimum = [-2.0, -2.0]

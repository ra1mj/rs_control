syntax = "proto3";

package robot.v1;

import "robot/v1/common.proto";

// One explicitly qualified motor-temperature observation.
message TemperatureObservation {
  oneof observation {
    // Calibrated temperature in degrees Celsius.
    double calibrated_celsius = 1;
    // Device-protocol value whose physical conversion is not qualified.
    uint32 raw = 2;
  }
}

// Standardized motor feedback in SI units.
message MotorState {
  // Common sample metadata.
  Header header = 1;
  // Logical motor resource such as chassis.front_left.
  string resource_id = 2;
  // Rotor/output position in radians according to the compiled motor profile.
  double position_rad = 3;
  // Angular velocity in radians per second.
  double velocity_radps = 4;
  // Estimated torque in newton metres.
  double torque_nm = 5;
  // Legacy power-stage Celsius value; used only when explicit_temperature_observations is false.
  double mos_temperature_c = 6;
  // Legacy rotor Celsius value; used only when explicit_temperature_observations is false.
  double rotor_temperature_c = 7;
  // Stable driver-owned numeric fault code; zero means no reported device fault.
  uint32 fault_code = 8;
  // Explicit power-stage observation.
  TemperatureObservation mos_temperature = 9;
  // Explicit rotor/winding observation.
  TemperatureObservation rotor_temperature = 10;
  // Selects fields 9 and 10; false preserves the original fields 6 and 7.
  bool explicit_temperature_observations = 11;
}

// IMU sample expressed in the frame named by Header.frame_id.
message ImuState {
  // Common sample metadata.
  Header header = 1;
  // Orientation as a unit quaternion.
  Quaternion orientation = 2;
  // Angular velocity in radians per second.
  Vector3 angular_velocity_radps = 3;
  // Linear acceleration in metres per second squared.
  Vector3 linear_acceleration_mps2 = 4;
  // Row-major 3x3 orientation covariance.
  repeated double orientation_covariance = 5;
  // Row-major 3x3 angular-velocity covariance.
  repeated double angular_velocity_covariance = 6;
  // Row-major 3x3 linear-acceleration covariance.
  repeated double linear_acceleration_covariance = 7;
}

// One time-aligned joint sample in SI units.
message JointState {
  // Stable logical joint/resource identifier.
  string resource_id = 1;
  // Joint position in radians.
  double position_rad = 2;
  // Joint velocity in radians per second.
  double velocity_radps = 3;
  // Joint effort in newton metres.
  double effort_nm = 4;
}

// Time-aligned aggregation used for one ROS JointState projection.
message JointStateAggregate {
  // Common timestamp and provenance for every joint in this aggregation.
  Header header = 1;
  // Bounded by the route's semantic policy before publication.
  repeated JointState joints = 2;
}
